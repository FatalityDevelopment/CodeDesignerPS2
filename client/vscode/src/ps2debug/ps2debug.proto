// Vendored from Ps2Emulator (proto/ps2debug.proto). Copy it again when the
// emulator's schema changes; fields are only ever added, so an older copy
// keeps working against a newer emulator.
//
// The emulator's debug protocol, version 1 (docs/codedesigner-analysis.md).
//
// Served by `ps2 ... --debug-server <addr>` over gRPC. Fields are only ever
// added; Hello reports the protocol version. Memory is addressed by
// (space, offset); the EE's KSEG aliases are not needed for anything but
// display. Errors use gRPC status codes:
//   FAILED_PRECONDITION  the request needs execution paused
//   NOT_FOUND            no breakpoint or watchpoint with that id
//   INVALID_ARGUMENT     a bad space, register, range or value
syntax = "proto3";

package ps2debug.v1;

// ---------------------------------------------------------------- common

// A 128-bit value (EE GPRs, VU registers): low and high 64 bits.
message U128 {
  uint64 lo = 1;
  uint64 hi = 2;
}

enum AddressSpace {
  ADDRESS_SPACE_UNSPECIFIED = 0;
  // The EE's virtual addresses, as loads and stores translate them.
  // Device registers are not part of it.
  EE_VIRTUAL = 1;
  EE_RAM = 2;      // main RAM (32 MiB), physical
  SCRATCHPAD = 3;  // EE scratchpad (16 KiB)
  BIOS = 4;        // boot ROM (4 MiB), read-only
  IOP_RAM = 5;     // IOP RAM (2 MiB)
  VU0_CODE = 6;
  VU0_DATA = 7;
  VU1_CODE = 8;
  VU1_DATA = 9;
  GS_LOCAL = 10;   // GS local memory (4 MiB), read-only
}

// --------------------------------------------------------------- session

service Session {
  // What the server offers. Call first.
  rpc Hello(HelloRequest) returns (HelloReply);
  // Execution state now.
  rpc Status(StatusRequest) returns (StatusReply);
  // Every event from now on, in order.
  rpc Events(EventsRequest) returns (stream Event);
}

message HelloRequest {
  // Free-form client name, for logs.
  string client_name = 1;
}

message SpaceInfo {
  AddressSpace space = 1;
  string name = 2;
  uint64 size = 3;
  bool writable = 4;
}

message HelloReply {
  uint32 protocol_version = 1;
  string server = 2;
  // Fully qualified service names served.
  repeated string services = 3;
  repeated SpaceInfo spaces = 4;
  // Largest request or reply message, in bytes.
  uint64 max_message_bytes = 5;
  // Pass back as `client` where requests take one, so points it creates
  // are attributed to it.
  uint32 client_id = 6;
}

message StatusRequest {}

message StatusReply {
  bool paused = 1;
  uint32 ee_pc = 2;
  uint64 ee_cycles = 3;
  // Whether breakpoints, watchpoints or a run-to keep execution
  // interpreted (slower).
  bool armed = 4;
  uint64 fields = 5;
  // Events dropped because the server's queue was full.
  uint64 dropped_events = 6;
}

message EventsRequest {}

enum Action {
  ACTION_BREAK = 0;  // pause
  ACTION_LOG = 1;    // record an event and keep running
}

message WatchHit {
  uint32 id = 1;
  uint32 pc = 2;
  // Physical EE bus address accessed.
  uint32 address = 3;
  uint32 size = 4;
  bool write = 5;
  U128 value = 6;
  Action action = 7;
}

message Paused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REQUESTED = 1;
    BREAKPOINT = 2;
    WATCHPOINT = 3;
    STEP = 4;
    RUN_TO = 5;
    FRAME_ADVANCE = 6;
    ERROR = 7;
  }
  Reason reason = 1;
  uint32 pc = 2;
  // REQUESTED: the client that asked.
  uint32 client = 3;
  // BREAKPOINT: the breakpoint.
  uint32 breakpoint = 4;
  // WATCHPOINT: the access.
  WatchHit watch = 5;
  // ERROR: what went wrong.
  string error = 6;
}

message BreakpointLogged {
  uint32 id = 1;
  uint32 pc = 2;
}

message Event {
  // Increases by one per event; a gap means events were dropped.
  uint64 sequence = 1;
  oneof kind {
    Paused paused = 2;
    bool resumed = 3;
    BreakpointLogged breakpoint_logged = 4;
    WatchHit watch_logged = 5;
  }
}

// ------------------------------------------------------------- execution

service Execution {
  rpc Pause(PauseRequest) returns (Empty);
  rpc Resume(Empty) returns (Empty);
  // Needs a pause. INTO runs one instruction (and its delay slot) and stays
  // paused; OVER runs a call to its return; OUT runs to $ra.
  rpc Step(StepRequest) returns (Empty);
  // Resumes until the EE reaches `address`.
  rpc RunTo(RunToRequest) returns (Empty);
  // Resumes for `fields` video fields, then pauses.
  rpc FrameAdvance(FrameAdvanceRequest) returns (Empty);
}

message Empty {}

message PauseRequest {
  uint32 client = 1;
}

message StepRequest {
  enum Kind {
    INTO = 0;
    OVER = 1;
    OUT = 2;
  }
  Kind kind = 1;
}

message RunToRequest {
  uint32 address = 1;
}

message FrameAdvanceRequest {
  uint32 fields = 1;
}

// ----------------------------------------------------------- breakpoints

service Breakpoints {
  rpc SetBreakpoint(SetBreakpointRequest) returns (PointReply);
  rpc SetWatchpoint(SetWatchpointRequest) returns (PointReply);
  // Removes a breakpoint or watchpoint.
  rpc Remove(PointRequest) returns (Empty);
  rpc SetEnabled(SetEnabledRequest) returns (Empty);
  rpc List(Empty) returns (PointList);
}

message Operand {
  oneof kind {
    uint64 constant = 1;
    // Low 64 bits of an EE GPR.
    uint32 gpr = 2;
    bool pc = 3;
    MemoryOperand memory = 4;
  }
}

message MemoryOperand {
  AddressSpace space = 1;
  uint64 offset = 2;
  // 1, 2, 4 or 8 bytes, little-endian.
  uint32 size = 3;
}

message Condition {
  enum Compare {
    EQUAL = 0;
    NOT_EQUAL = 1;
    LESS = 2;
    LESS_OR_EQUAL = 3;
    GREATER = 4;
    GREATER_OR_EQUAL = 5;
  }
  Operand left = 1;
  Compare compare = 2;
  Operand right = 3;
}

message SetBreakpointRequest {
  uint32 client = 1;
  // EE virtual address; every alias of the instruction hits.
  uint32 address = 2;
  optional Condition condition = 3;
  // Hit from the nth time the condition holds (0, 1: every time).
  uint32 hit_count = 4;
  Action action = 5;
}

enum AccessKind {
  READ = 0;
  WRITE = 1;
  READ_WRITE = 2;
}

message SetWatchpointRequest {
  uint32 client = 1;
  // EE_VIRTUAL, EE_RAM or BIOS.
  AddressSpace space = 2;
  uint64 offset = 3;
  uint64 length = 4;
  AccessKind kind = 5;
  // Only accesses of this value.
  optional U128 value = 6;
  Action action = 7;
}

message PointReply {
  uint32 id = 1;
}

message PointRequest {
  uint32 id = 1;
}

message SetEnabledRequest {
  uint32 id = 1;
  bool enabled = 2;
}

message BreakpointInfo {
  uint32 id = 1;
  uint32 client = 2;
  uint32 address = 3;
  optional Condition condition = 4;
  uint32 hit_count = 5;
  Action action = 6;
  uint32 hits = 7;
  bool enabled = 8;
}

message WatchpointInfo {
  uint32 id = 1;
  uint32 client = 2;
  AddressSpace space = 3;
  uint64 offset = 4;
  uint64 length = 5;
  AccessKind kind = 6;
  optional U128 value = 7;
  Action action = 8;
  uint32 hits = 9;
  bool enabled = 10;
}

message PointList {
  repeated BreakpointInfo breakpoints = 1;
  repeated WatchpointInfo watchpoints = 2;
}

// ---------------------------------------------------------------- memory

service Memory {
  rpc Read(ReadRequest) returns (ReadReply);
  // Many reads in one round trip, all from the same moment of emulation
  // (memory views, watch lists, structure dumps). Replies are in request
  // order; each is partial on its own as Read's are.
  rpc ReadMany(ReadManyRequest) returns (ReadManyReply);
  rpc Write(WriteRequest) returns (WriteReply);
  // The items' bytes as they change: all of them first, then the ones
  // that changed, sampled every `interval_ms`. Ends when the client goes.
  rpc Watch(WatchRequest) returns (stream WatchUpdate);
}

message WatchItem {
  AddressSpace space = 1;
  uint64 offset = 2;
  // At most 4096 bytes.
  uint32 length = 3;
}

message WatchRequest {
  // At most 1024.
  repeated WatchItem items = 1;
  // Between samples (0: 100 ms; at least 16 ms).
  uint32 interval_ms = 2;
}

message WatchValue {
  // Index in `WatchRequest.items`.
  uint32 item = 1;
  // As much as could be read (a read stops at unmapped memory).
  bytes data = 2;
}

message WatchUpdate {
  // The field the sample was taken in.
  uint64 field = 1;
  repeated WatchValue values = 2;
}

message ReadRequest {
  AddressSpace space = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message ReadReply {
  // The bytes read: all of them, or those before `unmapped_at`.
  bytes data = 1;
  // Set when the range ran into unmapped memory at this offset.
  optional uint64 unmapped_at = 2;
}

message ReadManyRequest {
  // At most 65536 reads, their lengths summing to less than the message
  // limit.
  repeated ReadRequest reads = 1;
}

message ReadManyReply {
  repeated ReadReply replies = 1;
}

message WriteRequest {
  AddressSpace space = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message WriteReply {
  // Bytes written before `unmapped_at` (all of them when unset).
  uint64 written = 1;
  optional uint64 unmapped_at = 2;
}

// ------------------------------------------------------------- registers

service Registers {
  rpc Ee(Empty) returns (EeRegisters);
  rpc Iop(Empty) returns (IopRegisters);
  rpc Set(SetRegisterRequest) returns (Empty);
}

message Vector {
  uint32 x = 1;
  uint32 y = 2;
  uint32 z = 3;
  uint32 w = 4;
}

message EeRegisters {
  uint32 pc = 1;
  repeated U128 gpr = 2;
  U128 hi = 3;
  U128 lo = 4;
  uint32 sa = 5;
  repeated uint32 cop0 = 6;
  repeated uint32 fpr = 7;
  uint32 fpu_acc = 8;
  uint32 fcr0 = 9;
  uint32 fcr31 = 10;
  repeated Vector vu0_vf = 11;
  repeated uint32 vu0_vi = 12;
  Vector vu0_acc = 13;
  bool in_delay_slot = 14;
  uint64 cycles = 15;
}

message IopRegisters {
  uint32 pc = 1;
  repeated uint32 gpr = 2;
  uint32 hi = 3;
  uint32 lo = 4;
  repeated uint32 cop0 = 5;
  uint64 cycles = 6;
}

message SetRegisterRequest {
  enum File {
    EE_PC = 0;
    EE_GPR = 1;
    EE_HI = 2;
    EE_LO = 3;
    EE_COP0 = 4;
    EE_FPR = 5;
    EE_FCR31 = 6;
    VU0_VF = 7;
    VU0_VI = 8;
    IOP_PC = 9;
    IOP_GPR = 10;
    IOP_COP0 = 11;
  }
  File file = 1;
  uint32 index = 2;
  U128 value = 3;
}

// ------------------------------------------------------------------ code

service Code {
  rpc Disassemble(DisassembleRequest) returns (DisassembleReply);
}

message DisassembleRequest {
  // EE virtual address of the first instruction.
  uint32 address = 1;
  // Instructions to read from memory. Ignored when `words` is set.
  uint32 count = 2;
  // When set, these instruction words are disassembled as if they were at
  // `address` onwards, instead of reading memory (a file, or bytes the
  // client already holds). At most 4096, like `count`.
  repeated uint32 words = 3;
  // State hints for each line (`Line.hint`); none by default. Hints come
  // from running the lines on a private copy of the CPU (memory is never
  // changed), from the entry of the function they are in when an index
  // knows it. While the emulator is paused, the CPU's registers seed the
  // copy: fully from the PC on, which also says which way branches go,
  // and before it the ones a function keeps (`gp` anywhere; `sp`, `fp`,
  // `s0`-`s7` in the PC's function).
  HintLevel hints = 4;
}

enum HintLevel {
  HINTS_NONE = 0;
  // Only hints that name a place: control flow, loads and stores,
  // syscalls, values that look like addresses.
  HINTS_ADDRESSES = 1;
  // Everything: values, call arguments, stack frames as well.
  HINTS_FULL = 2;
}

message Line {
  uint32 address = 1;
  uint32 word = 2;
  string text = 3;
  // The symbol at this address (empty: none; see Symbols).
  string label = 4;
  // References to this address in the built indexes (see Index), from
  // code and from data. 0 when no index covers them.
  uint32 code_refs = 5;
  uint32 data_refs = 6;
  // Whether an index found a function starting here.
  bool function_start = 7;
  // A jump's or branch's static target's symbol (empty: none).
  string target_label = 8;
  // Set when an index found this word inside a data table.
  optional TableKind table = 9;
  // What the instruction does with the values it sees (see
  // `DisassembleRequest.hints`): `a0 = 0x00301234`, `v0 ← [0x00301000] =
  // 0x00000005 "Weapon"`, `→ 0x00102040 (a0 = 0x00000001)`, `[TAKEN]`.
  // Empty: nothing to say, or not asked.
  string hint = 10;
}

message DisassembleReply {
  // Stops early at unmapped memory.
  repeated Line lines = 1;
}

// ----------------------------------------------------------------- media

service Media {
  // Console text from the EE (`sio`) and the IOP (`printf`), as produced.
  rpc Console(ConsoleRequest) returns (stream ConsoleText);
  // The displayed frame, at most `max_fps` times a second. A slow client
  // gets the latest frame, never a backlog.
  rpc Frames(FramesRequest) returns (stream FrameImage);
}

message ConsoleRequest {}

message ConsoleText {
  enum Source {
    EE = 0;
    IOP = 1;
  }
  Source source = 1;
  bytes text = 2;
}

message FramesRequest {
  // 0: every field.
  uint32 max_fps = 1;
}

message FrameImage {
  uint32 width = 1;
  uint32 height = 2;
  // Row-major RGBA8.
  bytes rgba = 3;
  uint64 field = 4;
}

// --------------------------------------------------------------- symbols

// Names for addresses: ELF symbol tables and what clients push (Code
// Designer's label sets). Addresses are normalized: KSEG0/KSEG1 and the
// uncached RAM mirrors fold to physical, so every alias has the same
// symbols; replies give the normalized address. One symbol per address
// and source; a client's wins over the ELF's ("elf").
service Symbols {
  // Names addresses under `source`.
  rpc Set(SetSymbolsRequest) returns (SymbolCount);
  // Removes symbols of a source: at some addresses, or all of them.
  rpc Remove(RemoveSymbolsRequest) returns (SymbolCount);
  // Loads an ELF's symbol table under the source "elf", replacing the
  // previous ELF's. A stripped ELF has none.
  rpc LoadElf(LoadElfRequest) returns (SymbolCount);
  // Symbols covering addresses, and addresses with names.
  rpc Lookup(LookupRequest) returns (LookupReply);
  // Symbols in address order, a page at a time.
  rpc List(ListSymbolsRequest) returns (SymbolPage);
}

enum SymbolKind {
  SYMBOL_LABEL = 0;
  SYMBOL_FUNCTION = 1;
  SYMBOL_OBJECT = 2;
}

message SymbolInfo {
  uint32 address = 1;
  string name = 2;
  // Bytes covered (0: the address alone).
  uint32 size = 3;
  SymbolKind kind = 4;
  string source = 5;
}

message SetSymbolsRequest {
  // Who names them, e.g. a label set's name. Not "elf".
  string source = 1;
  // Clear `source`'s symbols first.
  bool replace = 2;
  // `source` fields are ignored.
  repeated SymbolInfo symbols = 3;
}

message SymbolCount {
  // Symbols added or removed.
  uint32 changed = 1;
  // Addresses with symbols, from all sources.
  uint32 total = 2;
}

message RemoveSymbolsRequest {
  string source = 1;
  // Empty: every symbol of `source`.
  repeated uint32 addresses = 2;
}

message LoadElfRequest {
  oneof file {
    // A path on the emulator's machine.
    string path = 1;
    bytes data = 2;
  }
}

message LookupRequest {
  repeated uint32 addresses = 1;
  repeated string names = 2;
}

message SymbolHit {
  // As asked.
  uint32 address = 1;
  // The symbol at it, or the sized symbol covering it; unset when none.
  optional SymbolInfo symbol = 2;
  // How far into the symbol `address` is.
  uint32 offset = 3;
}

message NameHit {
  string name = 1;
  repeated uint32 addresses = 2;
}

message LookupReply {
  // One per address asked, in order.
  repeated SymbolHit symbols = 1;
  // One per name asked, in order.
  repeated NameHit names = 2;
}

message ListSymbolsRequest {
  // First address.
  uint32 from = 1;
  // Most symbols to return (0: 1000; at most 65536).
  uint32 limit = 2;
  // Only names containing this, ignoring case.
  string contains = 3;
}

message SymbolPage {
  repeated SymbolInfo symbols = 1;
  // Where the next page starts; unset at the end.
  optional uint32 next = 2;
}

// ----------------------------------------------------------------- index

// The code index (crates/analysis): every call, jump, branch, built
// address, load, store and data pointer to an address; functions; switch,
// pointer and float tables. Built from a snapshot of a region's memory, on
// a thread of its own while the game keeps running; it reflects memory as
// it was then (rebuild after the game loads code). Addresses are
// normalized as for Symbols; IOP RAM is at 0x1C000000.
service Index {
  // Takes a snapshot of the region now and indexes it, replacing the
  // previous index once done.
  rpc Build(BuildIndexRequest) returns (IndexInfo);
  rpc Status(IndexStatusRequest) returns (IndexStatusReply);
  // References to an address, from every built index.
  rpc RefsTo(RefsToRequest) returns (RefsReply);
  // Functions found, a page at a time, or the one holding an address.
  rpc Functions(FunctionsRequest) returns (FunctionsReply);
  rpc Tables(TablesRequest) returns (TablesReply);
}

enum IndexRegion {
  INDEX_EE_RAM = 0;   // main RAM, at 0
  INDEX_IOP_RAM = 1;  // IOP RAM, at 0x1C000000
}

message BuildIndexRequest {
  IndexRegion region = 1;
  // Reply once the index is built (else at once, building).
  bool wait = 2;
}

message IndexInfo {
  IndexRegion region = 1;
  // An index is built and can be queried.
  bool ready = 2;
  // A build is running (a ready index stays until it is replaced).
  bool building = 3;
  // Of the ready index: the field its snapshot was taken at.
  uint64 field = 4;
  uint32 base = 5;
  uint32 size = 6;
  uint64 refs = 7;
  uint32 functions = 8;
  uint32 tables = 9;
  // How long the build took.
  uint32 build_millis = 10;
}

message IndexStatusRequest {}

message IndexStatusReply {
  repeated IndexInfo regions = 1;
}

enum RefKind {
  REF_CALL = 0;           // jal, bal, jalr through a known register
  REF_JUMP = 1;           // j, b
  REF_BRANCH = 2;         // conditional branch
  REF_REGISTER_JUMP = 3;  // jr through a known register
  REF_ADDRESS = 4;        // lui + addiu/ori builds it
  REF_LOAD = 5;
  REF_STORE = 6;
  REF_POINTER = 7;        // a data word holding it
  REF_CASE = 8;           // a switch table entry
  // A jalr or jr through a register that a trace saw land here.
  REF_OBSERVED = 9;
}

message RefsToRequest {
  uint32 address = 1;
  // Only these kinds (empty: all).
  repeated RefKind kinds = 2;
  // Skip this many.
  uint32 offset = 3;
  // Most to return (0: 1000).
  uint32 limit = 4;
}

message Ref {
  // The instruction or data word referring.
  uint32 from = 1;
  RefKind kind = 2;
  // The word at `from`, as indexed, and its disassembly.
  uint32 word = 3;
  string text = 4;
  // The function holding `from`, and its symbol (empty: none).
  optional uint32 function = 5;
  string function_name = 6;
}

message RefsReply {
  // The normalized address asked about.
  uint32 target = 1;
  // References in all (before offset and limit).
  uint32 total = 2;
  repeated Ref refs = 3;
}

message FunctionsRequest {
  IndexRegion region = 1;
  // First start address.
  uint32 from = 2;
  // Most to return (0: 1000; at most 65536).
  uint32 limit = 3;
  // Instead: only the function holding this address.
  optional uint32 containing = 4;
}

message FunctionInfo {
  uint32 start = 1;
  // Last instruction (inclusive).
  uint32 end = 2;
  // Its symbol (empty: none).
  string name = 3;
  // Calls to it.
  uint32 callers = 4;
}

message FunctionsReply {
  repeated FunctionInfo functions = 1;
  // Functions in the index.
  uint32 total = 2;
  // Where the next page starts; unset at the end.
  optional uint32 next = 3;
}

enum TableKind {
  TABLE_JUMP = 0;
  TABLE_POINTER = 1;
  TABLE_FLOAT = 2;
}

message TablesRequest {
  IndexRegion region = 1;
  uint32 from = 2;
  // Most to return (0: 1000; at most 65536).
  uint32 limit = 3;
}

message TableInfo {
  uint32 start = 1;
  uint32 count = 2;
  TableKind kind = 3;
}

message TablesReply {
  repeated TableInfo tables = 1;
  uint32 total = 2;
  optional uint32 next = 3;
}

// ---------------------------------------------------------------- search

// Value scans that narrow down where a game keeps a value, the way a cheat
// search does, and pointer chains to it. Sessions, their candidates and
// the memory they compare with stay in the emulator: a client pages
// through results and never copies memory.
service Search {
  // A first scan of a region: a new session with its candidates.
  rpc NewScan(NewScanRequest) returns (ScanInfo);
  // Narrows a session's candidates, comparing with memory now (and with
  // what they held at the last scan).
  rpc NextScan(NextScanRequest) returns (ScanInfo);
  // Back to the candidates before the last next scan (one step).
  rpc UndoScan(ScanRef) returns (ScanInfo);
  rpc ScanResults(ScanResultsRequest) returns (ScanResultsPage);
  rpc EndScan(ScanRef) returns (Empty);
  rpc ListScans(Empty) returns (ScanList);
  // Pointer chains from base addresses to a target in EE main RAM, from
  // a snapshot of it.
  rpc FindPointers(FindPointersRequest) returns (PointerChains);
  // Where chains lead in memory now (after the game moved things: keep
  // the ones that still reach the value).
  rpc CheckPointers(CheckPointersRequest) returns (PointerChains);
}

enum ValueKind {
  // An integer of `size` 1, 2, 4 or 8 bytes.
  VALUE_INT = 0;
  VALUE_FLOAT = 1;   // 4 bytes
  VALUE_DOUBLE = 2;  // 8 bytes
  VALUE_STRING = 3;  // Latin-1 text
  VALUE_BYTES = 4;   // hex bytes, `??` for any
}

enum Compare {
  COMPARE_EXACT = 0;
  COMPARE_NOT = 1;
  COMPARE_GREATER = 2;
  COMPARE_LESS = 3;
  // Between `value` and `value2`, inclusive.
  COMPARE_BETWEEN = 4;
  // Anything (first scans only).
  COMPARE_UNKNOWN = 5;
  // The rest compare with the last scan (next scans only).
  COMPARE_CHANGED = 6;
  COMPARE_UNCHANGED = 7;
  COMPARE_INCREASED = 8;
  COMPARE_DECREASED = 9;
  COMPARE_INCREASED_BY = 10;
  COMPARE_DECREASED_BY = 11;
}

message NewScanRequest {
  // EE_RAM, IOP_RAM or SCRATCHPAD.
  AddressSpace space = 1;
  uint64 start = 2;
  // Exclusive; 0: the end of the space.
  uint64 end = 3;
  ValueKind kind = 4;
  // Bytes of a VALUE_INT.
  uint32 size = 5;
  bool signed = 6;
  // Integers are hex without `0x`.
  bool hex = 7;
  Compare compare = 8;
  // As typed: decimal, `0x` hex; floats equal it when they round to it.
  string value = 9;
  string value2 = 10;
  // Bytes between candidates (0: the value's size; patterns go byte by
  // byte).
  uint32 step = 11;
}

message NextScanRequest {
  uint32 id = 1;
  Compare compare = 2;
  string value = 3;
  string value2 = 4;
  bool hex = 5;
}

message ScanRef {
  uint32 id = 1;
}

message ScanInfo {
  uint32 id = 1;
  uint64 count = 2;
  // Scans so far, the first included.
  uint32 scans = 3;
  bool can_undo = 4;
  AddressSpace space = 5;
  ValueKind kind = 6;
  uint32 size = 7;
  bool signed = 8;
  // The field the last scan read memory in, and how long it took.
  uint64 field = 9;
  uint32 millis = 10;
}

message ScanList {
  repeated ScanInfo scans = 1;
}

message ScanResultsRequest {
  uint32 id = 1;
  uint64 from = 2;
  // At most 10000 (0: 100).
  uint32 limit = 3;
  // Read each result's value now too.
  bool current = 4;
}

message ScanResult {
  // Offset in the session's space (for EE_RAM, the physical address).
  uint64 address = 1;
  // What it held at the last scan, raw and as text.
  bytes previous = 2;
  string previous_text = 3;
  // Now, when asked (empty when it cannot be read).
  bytes current = 4;
  string current_text = 5;
}

message ScanResultsPage {
  repeated ScanResult results = 1;
  uint64 count = 2;
}

message PointerChain {
  // Physical EE address of the first pointer.
  uint32 base = 1;
  // Added after each read; the target's offset last.
  repeated uint32 offsets = 2;
  // Where it leads now (CheckPointers), unset when a read fails.
  optional uint32 leads_to = 3;
}

message FindPointersRequest {
  // EE address of the value (any alias).
  uint32 target = 1;
  // Pointers per chain, at most (0: 4; at most 8).
  uint32 max_depth = 2;
  // Largest offset after a pointer (0: 0x1000).
  uint32 max_offset = 3;
  // Where chains may start, physical (both 0: 0x100000 to the end of
  // RAM). Static data, which does not move, makes the useful bases.
  uint32 base_start = 4;
  uint32 base_end = 5;
  // Chains, at most (0: 1000; at most 100000).
  uint32 limit = 6;
  // Take unaligned words for pointers too (pointers to objects are
  // aligned; the offset after one need not be).
  bool unaligned = 7;
}

message CheckPointersRequest {
  repeated PointerChain chains = 1;
  // When set, only chains that lead to this address (any alias).
  optional uint32 target = 2;
}

message PointerChains {
  // The shortest first.
  repeated PointerChain chains = 1;
  // The limit stopped the scan.
  bool limited = 2;
  uint32 millis = 3;
}

// ------------------------------------------------------------- snapshots

// Copies of memory kept in the emulator, to compare later.
service Snapshots {
  rpc Take(TakeSnapshotRequest) returns (SnapshotInfo);
  rpc List(Empty) returns (SnapshotList);
  rpc Drop(SnapshotRef) returns (Empty);
  // Where two snapshots (or one and memory now) differ.
  rpc Diff(DiffRequest) returns (DiffReply);
  // What a few bytes held in each snapshot, oldest first.
  rpc History(HistoryRequest) returns (HistoryReply);
}

message TakeSnapshotRequest {
  string name = 1;
  // EE_RAM (default), IOP_RAM or SCRATCHPAD.
  AddressSpace space = 2;
}

message SnapshotInfo {
  uint32 id = 1;
  string name = 2;
  AddressSpace space = 3;
  uint64 size = 4;
  uint64 field = 5;
}

message SnapshotList {
  repeated SnapshotInfo snapshots = 1;
}

message SnapshotRef {
  uint32 id = 1;
}

message DiffRequest {
  uint32 before = 1;
  // Unset: memory now.
  optional uint32 after = 2;
  // Compared in words of this many bytes (0: 4).
  uint32 unit = 3;
  // First offset to compare.
  uint64 from = 4;
  // Spans, at most (0: 1000; at most 100000).
  uint32 limit = 5;
}

message DiffSpan {
  uint64 offset = 1;
  uint32 length = 2;
  // The first 64 bytes of the span on each side.
  bytes before = 3;
  bytes after = 4;
}

message DiffReply {
  repeated DiffSpan spans = 1;
  // Where to continue (from), when the limit was reached.
  optional uint64 next = 2;
}

message HistoryRequest {
  AddressSpace space = 1;
  uint64 offset = 2;
  // At most 64.
  uint32 length = 3;
}

message HistoryValue {
  uint32 snapshot = 1;
  string name = 2;
  uint64 field = 3;
  bytes data = 4;
}

message HistoryReply {
  repeated HistoryValue values = 1;
}

// ----------------------------------------------------------------- trace

// What the EE does while it runs, recorded inside the run loop: coverage,
// calls and returns, branches, every instruction, loads and stores to
// chosen addresses. While a trace runs the EE is interpreted one
// instruction at a time (as with breakpoints); results stay in the
// emulator until dropped. A trace's indirect calls and jumps are added to
// the code index's references (REF_OBSERVED) when it stops.
service Trace {
  rpc Start(StartTraceRequest) returns (TraceInfo);
  // Disarms a trace; what it recorded stays until Drop.
  rpc Stop(TraceRef) returns (TraceInfo);
  rpc Status(TraceRef) returns (TraceInfo);
  rpc List(Empty) returns (TraceList);
  // A stopped trace's records, in order.
  rpc Records(TraceRecordsRequest) returns (TraceRecordsPage);
  // The code a stopped trace saw run, optionally less what another saw
  // ("what runs when I fire": a trace while firing without one while not).
  rpc Coverage(CoverageRequest) returns (CoverageReply);
  // Who called whom in a stopped trace's calls, by function.
  rpc CallGraph(TraceRef) returns (CallGraphReply);
  rpc Drop(TraceRef) returns (Empty);
}

message AccessFilter {
  // EE address (any alias) and bytes.
  uint32 address = 1;
  uint32 length = 2;
  bool reads = 3;
  bool writes = 4;
}

message StartTraceRequest {
  // Its owner: the trace goes when the client does.
  uint32 client = 1;
  bool coverage = 2;
  // Calls (jal, jalr, bal) with their arguments, and returns (jr ra).
  bool calls = 3;
  // Taken branches and jumps.
  bool branches = 4;
  // Every instruction's address.
  bool instructions = 5;
  // Loads and stores to log ("who writes this").
  repeated AccessFilter accesses = 6;
  // Records to keep (0: 65536; at most 4194304); later ones are counted.
  uint32 limit = 7;
  // Stop by itself after this many fields (0: when asked).
  uint32 fields = 8;
}

message TraceRef {
  uint32 id = 1;
}

message TraceInfo {
  uint32 id = 1;
  bool running = 2;
  uint64 instructions = 3;
  uint64 records = 4;
  // Records past the limit, not kept.
  uint64 dropped = 5;
  // Distinct instructions that ran (with coverage).
  uint64 covered = 6;
  uint64 start_field = 7;
  // When it stopped (0 while running).
  uint64 end_field = 8;
}

message TraceList {
  repeated TraceInfo traces = 1;
}

message CallRecord {
  uint32 from = 1;
  uint32 to = 2;
  uint32 sp = 3;
  // a0-a3 as the callee got them.
  repeated uint32 args = 4;
  // Through a register (jalr).
  bool indirect = 5;
}

message ReturnRecord {
  uint32 from = 1;
  uint32 to = 2;
}

message BranchRecord {
  uint32 from = 1;
  uint32 to = 2;
  bool indirect = 3;
}

message AccessRecord {
  // The instruction.
  uint32 pc = 1;
  // Physical address.
  uint32 address = 2;
  uint32 size = 3;
  bool write = 4;
  U128 value = 5;
}

message TraceRecord {
  oneof kind {
    CallRecord call = 1;
    ReturnRecord return = 2;
    BranchRecord branch = 3;
    uint32 instruction = 4;
    AccessRecord access = 5;
  }
}

message TraceRecordsRequest {
  uint32 id = 1;
  uint64 from = 2;
  // At most 100000 (0: 1000).
  uint32 limit = 3;
}

message TraceRecordsPage {
  repeated TraceRecord records = 1;
  uint64 total = 2;
}

message CoverageRequest {
  uint32 id = 1;
  // Leave out what this trace saw run.
  optional uint32 without = 2;
}

message CoverageRange {
  // Physical address and bytes of consecutive instructions that ran.
  uint32 start = 1;
  uint32 length = 2;
}

message CoverageReply {
  repeated CoverageRange ranges = 1;
  // Instructions in the ranges.
  uint64 instructions = 2;
  // Functions (from the EE index) whose first instruction is in them.
  repeated uint32 functions = 3;
}

message CallEdge {
  // The calling function (its start, from the EE index; the call itself
  // without one) and the callee.
  uint32 caller = 1;
  uint32 callee = 2;
  uint32 count = 3;
  string caller_name = 4;
  string callee_name = 5;
}

message CallGraphReply {
  // Most frequent first.
  repeated CallEdge edges = 1;
}

// -------------------------------------------------------------------- os

// What the guest's kernels keep, read in place: threads, modules, stacks.
// Empty while a kernel is not up (or not where expected).
service Os {
  rpc EeThreads(Empty) returns (ThreadList);
  rpc IopThreads(Empty) returns (ThreadList);
  rpc IopModules(Empty) returns (ModuleList);
  // The calls an EE thread is in, innermost first.
  rpc StackWalk(StackWalkRequest) returns (StackWalkReply);
}

enum ThreadState {
  THREAD_OTHER = 0;
  THREAD_RUNNING = 1;
  THREAD_READY = 2;
  THREAD_WAITING = 3;
  THREAD_SUSPENDED = 4;
  THREAD_WAITING_SUSPENDED = 5;
  THREAD_DORMANT = 6;
}

message ThreadInfo {
  uint32 id = 1;
  ThreadState state = 2;
  // Where it runs, or will resume.
  uint32 pc = 3;
  // Saved (or the CPU's, running); 0 when not known.
  uint32 sp = 4;
  uint32 ra = 5;
  uint32 entry = 6;
  uint32 priority = 7;
  // What it waits for: a kernel-specific kind and the object's id.
  uint32 wait_kind = 8;
  uint32 wait_id = 9;
  uint32 stack = 10;
  uint32 stack_size = 11;
}

message ThreadList {
  repeated ThreadInfo threads = 1;
}

message ModuleInfo {
  string name = 1;
  // Major and minor, a byte each.
  uint32 version = 2;
  uint32 entry = 3;
  uint32 gp = 4;
  uint32 text = 5;
  uint32 text_size = 6;
  uint32 data_size = 7;
  uint32 bss_size = 8;
}

message ModuleList {
  // The latest loaded first.
  repeated ModuleInfo modules = 1;
}

message StackWalkRequest {
  // An EE thread's id (EeThreads); unset: the CPU as it is now.
  optional uint32 thread = 1;
}

message StackFrame {
  // The PC, or the return address into the frame.
  uint32 pc = 1;
  uint32 sp = 2;
  // Where its function starts, when found.
  optional uint32 entry = 3;
  uint32 stack_size = 4;
  // The symbol at the entry (empty: none).
  string function = 5;
}

message StackWalkReply {
  repeated StackFrame frames = 1;
}

// --------------------------------------------------------------- patches

// Raw PS2 cheat codes (decrypted: AAAAAAAA VVVVVVVV lines) the emulator
// applies itself at the start of every field, as Code Designer's injected
// cheat engine would, with no hook in the game: constant writes (types 0,
// 1, 2), increments (3), serial writes (4), the timer (B) and compares
// guarding the lines after them (C, D, E). Hook and master codes (9, F)
// are ignored.
service Patches {
  // Adds a patch, or replaces the one with its name.
  rpc Set(SetPatchRequest) returns (PatchInfo);
  rpc List(Empty) returns (PatchList);
  rpc Enable(EnablePatchRequest) returns (PatchInfo);
  rpc Remove(PatchRef) returns (Empty);
}

message SetPatchRequest {
  string name = 1;
  // Cheat text: names, blank lines and code lines (`//` comments allowed).
  string codes = 2;
  bool enabled = 3;
}

message PatchInfo {
  string name = 1;
  bool enabled = 2;
  // Engine rows the codes became.
  uint32 rows = 3;
  // Lines that could not be translated (they do nothing), and lines
  // ignored on purpose.
  repeated string errors = 4;
  repeated string warnings = 5;
  // Fields it was applied in.
  uint64 applied = 6;
}

message PatchList {
  repeated PatchInfo patches = 1;
}

message EnablePatchRequest {
  string name = 1;
  bool enabled = 2;
}

message PatchRef {
  string name = 1;
}

// ------------------------------------------------------------------ pads

// Controller input from clients, on top of the frontend's own controller
// (buttons held by either count as held). Applied at the start of each
// field.
service Pads {
  // Holds buttons and sticks until changed or released.
  rpc Hold(PadInputRequest) returns (PadState);
  // Holds them for some fields, then lets go.
  rpc Press(PressRequest) returns (PadState);
  // Lets go of everything held on a port.
  rpc Release(PadPort) returns (PadState);
  rpc Get(PadPort) returns (PadState);
}

// In the pad's button word order.
enum PadButton {
  PAD_L2 = 0;
  PAD_R2 = 1;
  PAD_L1 = 2;
  PAD_R1 = 3;
  PAD_TRIANGLE = 4;
  PAD_CIRCLE = 5;
  PAD_CROSS = 6;
  PAD_SQUARE = 7;
  PAD_SELECT = 8;
  PAD_L3 = 9;
  PAD_R3 = 10;
  PAD_START = 11;
  PAD_UP = 12;
  PAD_RIGHT = 13;
  PAD_DOWN = 14;
  PAD_LEFT = 15;
}

message Sticks {
  // 0-255, 127 at rest; y grows downwards.
  uint32 left_x = 1;
  uint32 left_y = 2;
  uint32 right_x = 3;
  uint32 right_y = 4;
}

message PadInputRequest {
  // 0 or 1.
  uint32 port = 1;
  repeated PadButton buttons = 2;
  // Unset: the sticks are left as they are.
  optional Sticks sticks = 3;
}

message PressRequest {
  uint32 port = 1;
  repeated PadButton buttons = 2;
  optional Sticks sticks = 3;
  // How long (0: 6 fields, a tenth of a second).
  uint32 fields = 4;
}

message PadPort {
  uint32 port = 1;
}

message PadState {
  uint32 port = 1;
  // What clients hold on it.
  repeated PadButton held = 2;
  optional Sticks sticks = 3;
  // Fields left of a press (0: held until released).
  uint32 fields_left = 4;
  // A controller is plugged in there.
  bool connected = 5;
}
