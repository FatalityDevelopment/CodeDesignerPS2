name: Reject Build Artifacts

on:
  pull_request:
    branches: [master, main]

jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check for build artifacts in PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject obj/bin directories
        run: |
          # Check if any files under obj/ or bin/ directories are tracked in this PR
          BAD_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '**/obj/**' '**/bin/**' '**\\obj\\**' '**\\bin\\**' || true)
          if [ -n "$BAD_FILES" ]; then
            echo "::error::BUILD ARTIFACTS DETECTED! The following files under obj/ or bin/ must not be committed:"
            echo "$BAD_FILES"
            echo ""
            echo "These are build outputs covered by .gitignore. Remove them with:"
            echo "  git rm --cached <file>"
            exit 1
          fi
          echo "No build artifacts found."
