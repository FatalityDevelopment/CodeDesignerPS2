name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore .NET dependencies
        shell: bash
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*"); do
            dotnet restore "$proj"
          done

      - name: Build .NET projects
        shell: bash
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*"); do
            echo "::group::Building $proj"
            dotnet build "$proj" -c Release --no-restore
            echo "::endgroup::"
          done

      - name: Run tests
        run: dotnet test CodeDesigner.Ps2.TestProject/CodeDesigner.Ps2.TestProject.csproj -c Release --no-build --no-restore --verbosity normal

      - name: Publish .NET projects
        shell: bash
        run: |
          # Publish all C# projects except the test project
          for proj in $(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" -not -path "*/CodeDesigner.Ps2.TestProject/*"); do
            name=$(basename "$(dirname "$proj")")
            echo "::group::Publishing $name"
            dotnet publish "$proj" -c Release -o "publish/$name" --no-build
            echo "::endgroup::"
          done

      - name: Build VSCode Extension
        working-directory: vscode/codedesigner
        run: |
          npm ci
          npx @vscode/vsce package --out ../../publish/codedesigner.vsix

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeDesigner
          path: publish/

  build-pcsx2:
    name: Build PCSX2
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSBuild Clang Version
        working-directory: pcsx2
        shell: pwsh
        run: |
          [string[]] $clang_cl = &clang-cl.exe --version

          $version = [Regex]::Match($clang_cl[0], "(\d+\.\d+\.\d+)")
          $path = $clang_cl[3].TrimStart("InstalledDir: ").TrimEnd("\bin")

          $output = @"
          <Project>
            <PropertyGroup>
              <LLVMInstallDir>$path</LLVMInstallDir>
              <LLVMToolsVersion>$version</LLVMToolsVersion>
            </PropertyGroup>
          </Project>
          "@

          $output | Out-File Directory.build.props

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download patches
        working-directory: pcsx2/bin/resources
        shell: cmd
        run: aria2c -Z "https://github.com/PCSX2/pcsx2_patches/releases/latest/download/patches.zip"

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: pcsx2/deps
          key: ${{ runner.os }}-${{ runner.arch }}-pcsx2-deps-${{ hashFiles('pcsx2/.github/workflows/scripts/windows/build-dependencies.bat', 'pcsx2/.github/workflows/scripts/common/*.patch') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: pcsx2
        shell: cmd
        env:
          DEBUG: 0
          BUILD_FFMPEG: 1
        run: .github\workflows\scripts\windows\build-dependencies.bat

      - name: Build PCSX2
        working-directory: pcsx2
        shell: cmd
        run: msbuild "PCSX2_qt.sln" /m /v:m /p:Configuration="Release AVX2" /p:Platform="x64"

      - name: Upload PCSX2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2
          path: |
            pcsx2/bin
            !pcsx2/bin/**/*.bsc
            !pcsx2/bin/**/*.exp
            !pcsx2/bin/**/*.ilk
            !pcsx2/bin/**/*.iobj
            !pcsx2/bin/**/*.ipdb
            !pcsx2/bin/**/*.pdb
            !pcsx2/bin/**/*.lib
