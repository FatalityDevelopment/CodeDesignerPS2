name: Build

on:
  push:
    branches: [master, main]
    # A v* tag also publishes a GitHub release (the `release` job) that CodeDesignerInstaller.exe installs.
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # CheatCodeArchive is a private repository, which GITHUB_TOKEN cannot read. Add a repository
          # secret SUBMODULES_TOKEN (a fine-grained token whose resource owner is the FatalityDevelopment
          # organization, with Contents: read on this repository and on CheatCodeArchive) so the recursive
          # checkout can clone it. Without the secret this falls back to GITHUB_TOKEN, which is enough
          # only while every submodule is public.
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore .NET dependencies
        shell: bash
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*"); do
            dotnet restore "$proj"
          done

      - name: Build .NET projects
        shell: bash
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*"); do
            echo "::group::Building $proj"
            dotnet build "$proj" -c Release --no-restore
            echo "::endgroup::"
          done

      - name: Run tests
        run: dotnet test CodeDesigner.Ps2.TestProject/CodeDesigner.Ps2.TestProject.csproj -c Release --no-build --no-restore --verbosity normal

      # Same assets the release publishes: CodeDesigner.zip, CheatCodeArchive.zip, codedesigner.vsix and
      # CodeDesignerInstaller.exe (pinned to the tag on tag builds, "latest" otherwise).
      - name: Package release assets
        shell: pwsh
        run: ./tools/scripts/Build-Release.ps1 -OutputDir dist -Version '${{ github.ref_type == 'tag' && github.ref_name || '' }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeDesigner
          path: dist/

  build-pcsx2:
    name: Build PCSX2
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # CheatCodeArchive is a private repository, which GITHUB_TOKEN cannot read. Add a repository
          # secret SUBMODULES_TOKEN (a fine-grained token whose resource owner is the FatalityDevelopment
          # organization, with Contents: read on this repository and on CheatCodeArchive) so the recursive
          # checkout can clone it. Without the secret this falls back to GITHUB_TOKEN, which is enough
          # only while every submodule is public.
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Configure MSBuild Clang Version
        working-directory: pcsx2
        shell: pwsh
        run: |
          [string[]] $clang_cl = &clang-cl.exe --version

          $version = [Regex]::Match($clang_cl[0], "(\d+\.\d+\.\d+)")
          $path = $clang_cl[3].TrimStart("InstalledDir: ").TrimEnd("\bin")

          $output = @"
          <Project>
            <PropertyGroup>
              <LLVMInstallDir>$path</LLVMInstallDir>
              <LLVMToolsVersion>$version</LLVMToolsVersion>
            </PropertyGroup>
          </Project>
          "@

          $output | Out-File Directory.build.props

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download patches
        working-directory: pcsx2/bin/resources
        shell: cmd
        run: aria2c -Z "https://github.com/PCSX2/pcsx2_patches/releases/latest/download/patches.zip"

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: pcsx2/deps
          key: ${{ runner.os }}-${{ runner.arch }}-pcsx2-deps-${{ hashFiles('pcsx2/.github/workflows/scripts/windows/build-dependencies.bat', 'pcsx2/.github/workflows/scripts/common/*.patch') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: pcsx2
        shell: cmd
        env:
          DEBUG: 0
          BUILD_FFMPEG: 1
        run: .github\workflows\scripts\windows\build-dependencies.bat

      - name: Build PCSX2
        working-directory: pcsx2
        shell: cmd
        run: msbuild "PCSX2_qt.sln" /m /v:m /p:Configuration="Release AVX2" /p:Platform="x64"

      - name: Upload PCSX2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2
          path: |
            pcsx2/bin
            !pcsx2/bin/**/*.bsc
            !pcsx2/bin/**/*.exp
            !pcsx2/bin/**/*.ilk
            !pcsx2/bin/**/*.iobj
            !pcsx2/bin/**/*.ipdb
            !pcsx2/bin/**/*.pdb
            !pcsx2/bin/**/*.lib

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-pcsx2]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download CodeDesigner assets
        uses: actions/download-artifact@v4
        with:
          name: CodeDesigner
          path: assets

      - name: Download PCSX2
        uses: actions/download-artifact@v4
        with:
          name: PCSX2
          path: pcsx2-bin

      # Install-Release.ps1 extracts PCSX2.zip into %LOCALAPPDATA%\CodeDesigner\pcsx2\.
      - name: Zip PCSX2
        run: cd pcsx2-bin && zip -qr ../assets/PCSX2.zip .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" \
            --title "CodeDesigner ${{ github.ref_name }}" --generate-notes --verify-tag
