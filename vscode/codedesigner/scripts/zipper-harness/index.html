<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Zipper harness</title>
<script>
// Stands in for the VS Code extension host: acquireVsCodeApi() posts to /api, which calls the bridge's Zipper
// handlers. ?path=<file> is inspected on 'ready'; ?page=model-editor / animation-editor loads that webview instead of the workbench.
(function () {
  const params = new URLSearchParams(location.search);
  const initial = params.get('path');
  window.__page = params.get('page') || 'zipper-workbench';
  window.__log = [];
  const api = async (q) => {
    const r = await fetch('/api?' + new URLSearchParams(q));
    const j = await r.json();
    if (!(j.Success ?? j.success)) { throw new Error(j.Error ?? j.error ?? 'failed'); }
    return j.Data ?? j.data;
  };
  const post = (m) => window.postMessage(m, '*');
  async function inspect(p) { post({ type: 'zipperLoaded', result: JSON.parse(await api({ cmd: 'inspect', path: p })) }); }
  async function readAll(p) { return JSON.parse(await api({ cmd: 'readAll', path: p })); }
  window.acquireVsCodeApi = () => ({
    getState: () => null,
    setState: () => {},
    postMessage: async (msg) => {
      try {
        switch (msg.type) {
          case 'ready':
            post({ type: 'zipperReady' });
            if (initial && window.__page === 'zipper-workbench') { await inspect(initial); }
            if (initial && window.__page !== 'zipper-workbench') { post({ type: 'openPackage', path: initial }); }
            break;
          case 'refresh': await inspect(msg.path); break;
          case 'loadZdbPackage':
          case 'reloadZdbPackage':
          case 'loadPackage':
            post({ type: msg.type === 'loadPackage' ? 'package' : 'zdbPackage', path: msg.path, nodes: await readAll(msg.path), fromCache: false });
            break;
          case 'loadArchiveNodes': post({ type: 'archiveNodes', path: msg.path, nodes: await readAll(msg.path) }); break;
          case 'readNode':
            try { post({ type: 'nodeData', entryIndex: msg.entryIndex, data: await api({ cmd: 'readNode', path: msg.path, idx: msg.entryIndex }) }); }
            catch (e) { post({ type: 'nodeError', entryIndex: msg.entryIndex, message: String(e) }); }
            break;
          case 'readCompanionFiles': post({ type: 'companionFiles', companions: {} }); break;
          case 'asset': {
            // Model Editor: ASSET_* through the bridge's own handlers (POST /bridge).
            const r = await fetch('/bridge', { method: 'POST', body: JSON.stringify(msg.command) });
            const j = await r.json();
            post(j.Success
              ? { type: 'assetResult', id: msg.id, ok: true, data: JSON.parse(j.Data ?? 'null') }
              : { type: 'assetResult', id: msg.id, ok: false, error: j.Error ?? 'failed' });
            break;
          }
          case 'pickImage':
            // window.__pickImage = base64 PNG set by the test before clicking.
            post({ type: 'imagePicked', id: msg.id, name: 'harness.png', base64: window.__pickImage ?? null });
            break;
          case 'askText':
            // Tests set window.__answer; otherwise the browser prompt.
            post({ type: 'textAnswered', id: msg.id, text: window.__answer !== undefined ? window.__answer : window.prompt(msg.title, msg.value) });
            break;
          case 'pickSavePath':
            post({ type: 'pathPicked', id: msg.id, path: window.__pickPath ?? null });
            break;
          case 'pickText':
            post({ type: 'textPicked', id: msg.id, name: 'harness.obj', text: window.__pickText ?? null });
            break;
          case 'pickPackage': break;
          case 'zipperLog':
          case 'log':
            window.__log.push(msg.text); break;
          default: console.log('[harness] unhandled', msg.type, msg);
        }
      } catch (e) {
        console.error('[harness]', msg.type, e);
        post({ type: 'zipperError', message: String(e) });
      }
    },
  });
})();

window.__sleep = ms => new Promise(r => setTimeout(r, ms));
const leaf = (t) => [...document.querySelectorAll('*')].find(e => e.children.length === 0 && e.textContent.trim() === t);

// Workbench: open a root archive of the loaded ZDB and preview one entry; for worldmodel waits for composition.
window.__open = async (archiveLeaf, model) => {
  const sleep = window.__sleep;
  for (let i = 0; i < 80 && !window.__log.some(l => l.includes('top-level entries')); i++) { await sleep(500); }
  const row = [...document.querySelectorAll('*')].find(e => e.children.length === 0 && e.textContent.trim().endsWith(archiveLeaf));
  row.click();
  row.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
  await sleep(1500);
  [...document.querySelectorAll('button')].find(b => b.textContent.trim() === 'Enter Archive')?.click();
  await sleep(2500);
  leaf(model).click();
  const done = l => l.includes('GEO scene composed') || l.includes('composition failed') || l.includes('[decode]');
  for (let i = 0; i < 160 && !window.__log.some(done); i++) { await sleep(500); }
  await sleep(2500);
  return window.__log.filter(l => /clutter|Root:|Composed model|Missing|missing source|ERROR|failed/i.test(l)).join('\n');
};

// Fingerprint of what the workbench renders: composed model stats, per-chunk texture keys and the renderer's
// materials (mode + mean texel colour). Equal fingerprints before and after a refactor = same picture.
window.__capture = () => {
  const host = document.querySelector('app-zipper-workbench-page, app-model-editor-page');
  const cmp = ng.getComponent(host);
  const r = cmp.modelRenderer;
  const mdl = cmp.model();
  let h = 0;
  const mix = (s) => { for (let i = 0; i < s.length; i++) { h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0; } };
  for (const c of mdl.chunks) {
    mix(`${c.textureName}|${c.sourceModelName}|${c.vertices.length}|${c.materialBlend}|`);
    const v = c.vertices[0];
    if (v) { mix(`${v.x.toFixed(2)},${v.y.toFixed(2)},${v.z.toFixed(2)}`); }
  }
  const mats = r.materials.map(m => {
    const d = m.map?.image?.data;
    let s = 0;
    if (d) { for (let i = 0; i < d.length; i += 97) { s = (s + d[i]) | 0; } }
    return `${m.transparent ? 'T' : 'O'}${m.alphaTest.toFixed(2)}:${s}`;
  });
  mix(mats.join(';'));
  return { chunks: mdl.chunks.length, verts: mdl.vertices.length, materials: mats.length, hash: h };
};

window.__full = async () => {
  const c = document.querySelector('canvas');
  c.parentElement.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:9999;background:#111';
  window.dispatchEvent(new Event('resize'));
  await window.__sleep(1200);
};
window.__fly = async (point) => {
  const sel = [...document.querySelectorAll('select')].find(s => [...s.options].some(o => o.value === point));
  if (sel) { sel.value = point; sel.dispatchEvent(new Event('change', { bubbles: true })); }
  await window.__sleep(300);
  [...document.querySelectorAll('button')].find(x => /Fly from point/i.test(x.textContent))?.click();
  await window.__sleep(800);
  await window.__full();
};
window.__key = async (key, ms) => {
  window.dispatchEvent(new KeyboardEvent('keydown', { key, code: key, bubbles: true }));
  await window.__sleep(ms);
  window.dispatchEvent(new KeyboardEvent('keyup', { key, code: key, bubbles: true }));
  await window.__sleep(300);
};
</script>
</head>
<body>
<div id="harness-root"></div>
<script>
  const tag = ['model-editor', 'animation-editor'].includes(window.__page) ? `app-${window.__page}-page` : 'app-zipper-workbench-page';
  document.getElementById('harness-root').innerHTML = `<${tag}>Loading…</${tag}>`;
  const s = document.createElement('script');
  s.src = `/dist/${window.__page}.js`;
  document.body.appendChild(s);
</script>
</body>
</html>
