<app-panel-status-bar
  [isConnected]="isConnected"
  [isPaused]="isPaused"
  (togglePause)="togglePause()"
  (step)="step()"
/>

<div id="panel-tabs">
  <button class="panel-tab" [class.active]="activeTab === 'settings'" (click)="setTab('settings')">Emulator Settings</button>
  <button class="panel-tab" [class.active]="activeTab === 'cheats'" (click)="setTab('cheats')">Cheats</button>
  <button class="panel-tab" [class.active]="activeTab === 'cds'" (click)="setTab('cds')">CDS</button>
  <button class="panel-tab" [class.active]="activeTab === 'recompile'" (click)="setTab('recompile')">Recompile</button>
</div>

<div id="tab-settings" class="tab-content" [style.display]="activeTab === 'settings' ? 'block' : 'none'">
  <app-settings-tab
    [emulators]="emulators"
    [biosOptions]="biosOptions"
    [gameOptions]="gameOptions"
    [selectedEmulator]="selectedEmulator"
    [selectedBios]="selectedBios"
    [selectedGame]="selectedGame"
    [isConnected]="isConnected"
    [snapshots]="snapshots"
    [currentGameName]="currentGameName"
    (connectClick)="connect()"
    (runClick)="run()"
    (startPcsx2Click)="startPcsx2()"
    (restartClick)="restart()"
    (snapshotClick)="snapshot()"
    (snapshotPcsx2Click)="snapshotPcsx2()"
    (importBinClick)="importBin()"
    (emulatorChange)="onSelectedEmulatorChange($event)"
    (biosChange)="onSelectedBiosChange($event)"
    (gameChange)="onSelectedGameChange($event)"
    (browseEmulatorClick)="browseEmulator()"
    (browseBiosClick)="browseBios()"
    (browseGameClick)="browseGame()"
    (openSnapshotClick)="openSnapshot($event)"
    (reloadSnapshotClick)="reloadSnapshot($event)"
    (memoryCardClick)="openMemoryCard()"
  />
</div>

<div id="tab-cheats" class="tab-content" [style.display]="activeTab === 'cheats' ? 'flex' : 'none'">
  <app-cheats-tab
    [isConnected]="isConnected"
    [(cheatText)]="cheatText"
  />
</div>

<div id="tab-cds" class="tab-content" [style.display]="activeTab === 'cds' ? 'flex' : 'none'">
  <app-cds-tab
    [isConnected]="isConnected"
    (addCheatClick)="onAddCheat($event)"
  />
</div>

<div id="tab-recompile" class="tab-content" [style.display]="activeTab === 'recompile' ? 'block' : 'none'">
  <app-recompile-tab
    [isConnected]="isConnected"
    [selectedGame]="selectedGame"
  />
</div>

<!-- Memory Card Manager overlay (covers the full sidebar) -->
<app-memory-card-overlay
  #mcOverlayComp
  (browseMc)="onMcBrowse()"
  (newMc)="onMcNew()"
  (listSaves)="onMcList($event)"
  (exportSave)="onMcExport($event)"
  (importSave)="onMcImport($event)"
  (deleteSave)="onMcDelete($event)"
/>
