<div id="header">
<div id="header-toolbar">
    <button class="header-tool-btn" id="registers-toggle-btn" title="Toggle Registers Panel (Ctrl+Alt+R)">&#8863; Regs</button>
    <button class="header-tool-btn" id="bottom-panel-toggle-btn" title="Toggle Bottom Panel (Ctrl+Alt+T)">&#8693; Debug Tools</button>
    <button class="header-tool-btn" id="search-toggle-btn" title="Search (Ctrl+F)">&#8853; Search</button>
    <button class="header-tool-btn" id="goto-toggle-btn" title="Go to Address (Ctrl+Alt+A)">&#8594; Go To</button>
    <button class="header-tool-btn live-only" id="setpc-toggle-btn" title="Set PC to Address (Ctrl+Alt+P)">&#9655; Set PC</button>
    <button class="header-tool-btn" id="nav-back-btn" title="Navigate Back (Alt+Left)" disabled>&#8592; Back</button>


</div>
<!-- New Angular component-based panels -->
<app-address-input-panel
    [visible]="signals.panels.goto()"
    [panelId]="'goto-panel'"
    [placeholder]="'Go to address (hex)'"
    [buttonLabel]="'Go'"
    [buttonTitle]="'Go to address (Enter)'"
    [externalStatus]="gotoStatus()"
    [externalValue]="gotoValue()"
    (submit$)="onGotoAddress($event)"
  (valueChange)="onGotoValueChange($event)"
    (close)="onGotoClose()">
</app-address-input-panel>
<app-address-input-panel
    [visible]="signals.panels.setpc()"
    [panelId]="'setpc-panel'"
    [placeholder]="'New PC address (hex)'"
    [buttonLabel]="'Set PC'"
    [buttonTitle]="'Set PC (Enter)'"
    [externalStatus]="setpcStatus()"
    (submit$)="onSetPc($event)"
    (close)="onSetPcClose()">
</app-address-input-panel>
<app-search-panel
    (search)="onSearch($event)"
    (clear)="onSearchClear()"
    (close)="onSearchClose()"
    (prevMatch)="onPrevMatch()"
    (nextMatch)="onNextMatch()">
</app-search-panel>
<app-hex-view
    [data]="hexViewData"
    [offset]="hexViewOffset"
    [highlightAddr]="hexViewHighlightAddr"
    [highlightLength]="hexViewHighlightLength">
</app-hex-view>
</div>
<div id="content-wrapper">
<app-virtual-grid
    #virtualGrid
    [rows]="gridRows()"
    [pageStart]="gridPageStart()"
    [pointerLabelMap]="gridPointerLabelMap()"
    (selectRow)="onGridSelectRow($event)"
    (editRow)="onGridEditRow($event)"
    (contextMenu)="onGridContextMenu($event)"
    (navigateTarget)="onGridNavigateTarget()"
    (navigateBack)="onGridNavigateBack()"
    (toggleBreakpoint)="onGridToggleBreakpoint()"
    (cursorMove)="onGridCursorMove($event)"
  />
<app-context-menu
    #contextMenu
    (setBreakpoint)="onCtxSetBreakpoint()"
    (removeBreakpoint)="onCtxRemoveBreakpoint()"
    (addWatch)="onCtxAddWatch()"
    (removeWatch)="onCtxRemoveWatch()"
    (gotoTarget)="onCtxGotoTarget()"
    (findReferences)="onCtxFindReferences()"
    (findCodeReferences)="onCtxFindCodeReferences()"
    (addToLabelManager)="onCtxAddToLabelManager()"
    (closed)="onCtxClosed()"
  />
<!-- Angular DebugPanel (Phase 7) -->
<app-debug-panel
    [visible]="debugPanelVisible()"
    [registers]="debugPanelRegisters()"
    [stackBytes]="debugPanelStackBytes()"
    [stackBase]="debugPanelStackBase()"
    [watches]="debugPanelWatches()"
    (editRegister)="onDebugEditRegister($event)"
    (removeWatch)="onDebugPanelRemoveWatch($event)"
    (clearAllWatches)="onDebugPanelClearAllWatches()"
    (navigateToWatchAddress)="onDebugPanelNavigateWatch($event)"
  />
</div>
<!-- Angular BottomPanel (Phase 8) -->
<app-bottom-panel
    [visible]="bottomPanelVisible()"
    [callStack]="bottomPanelCallStack()"
    [threads]="bottomPanelThreads()"
    [modules]="bottomPanelModules()"
    [breakpoints]="bottomPanelBreakpoints()"
    [watches]="debugPanelWatches()"
    (navigateToAddress)="onBottomPanelNavigate($event)"
    (removeBreakpoint)="onBottomPanelRemoveBreakpoint($event)"
    (clearAllBreakpoints)="onBottomPanelClearAllBreakpoints()"
    (removeWatch)="onDebugPanelRemoveWatch($event)"
    (clearAllWatches)="onDebugPanelClearAllWatches()"
    (navigateToWatchAddress)="onBottomPanelNavigate($event)"
    (tabSelected)="onBottomPanelTabSelected($event)"
    (refreshTab)="onBottomPanelRefresh($event)"
  />
<!-- Angular Overlay Components (Phase 10) -->
<app-edit-overlay #editOverlayComp
    [externalDisasmPreview]="editOverlayDisasmPreview()"
    [externalHexBytes]="editOverlayExternalHexBytes()"
    [externalInstrPreview]="editOverlayExternalInstrPreview()"
    (save$)="onEditOverlaySave($event)"
    (close$)="onEditOverlayClose()"
    (assembleInstr)="onAssembleInstr($event)"
    (disasmBytes)="onDisasmBytes($event)"
    (requestHistory)="onRequestHistory($event)" />
<app-converter-overlay #converterOverlayComp
    (close$)="onConverterOverlayClose()"
    (convert$)="onConvertCheat($event)" />
<app-porter-overlay #porterOverlayComp
    (close$)="onPorterOverlayClose()"
    (port$)="onPortCheats($event)"
    (browseSource)="onBrowseSourceDump()"
    (browseTarget)="onBrowseTargetDump()" />
<app-memory-card-overlay #mcOverlayComp
    (browseMc)="onMcBrowse()"
    (newMc)="onMcNew()"
    (listSaves)="onMcList($event)"
    (exportSave)="onMcExport($event)"
    (importSave)="onMcImport($event)"
    (deleteSave)="onMcDelete($event)" />
<app-hdd-overlay #hddOverlayComp
    (browseHdd)="onHddBrowse()"
    (newHdd)="onHddNew()"
    (listPartitions)="onHddList($event)"
    (exportPartition)="onHddExport($event)"
    (viewFiles)="onHddViewFiles($event)"
    (deletePartition)="onHddDelete($event)" />
<app-scanner-overlay #scannerOverlayComp
    (close$)="onScannerOverlayClose()"
    (scan$)="onScanValue($event)"
    (navigate$)="onScannerNavigate($event)" />
<app-struct-offset-overlay #structOverlayComp
    (close$)="onStructOverlayClose()"
    (loadStructs$)="onStructLoadStructs()"
    (saveStruct$)="onSaveStruct($event)"
    (addMember$)="onAddStructMember($event)"
    (readPointer$)="onReadStructPointer($event)" />
