# Local container test (any machine with Docker):  docker compose up --build
# Set SERVER_IP to the address the PS2 can reach (this machine's LAN IP), and point the PS2's DNS at it.
services:
  socom2-server:
    build:
      context: ..                                  # repo root: the server references ../DnaSDK
      dockerfile: CodeDesigner.Ps2.Multiplayer/Dockerfile
    image: socom2-server:local
    restart: unless-stopped
    environment:
      Online__ServerIp: "${SERVER_IP:?set SERVER_IP to this machine's LAN IP, e.g. SERVER_IP=192.168.1.20}"
      # On a LAN the console may need other names resolved too; forwarding is safe there.
      Online__DnsForwardUnknown: "true"
      Logging__LogLevel__Default: "Debug"
      # Optional: send consoles to someone else's DNAS server (IP or hostname) instead of the built-in one,
      # e.g. EXTERNAL_DNAS=dnas.example.org docker compose up. Empty = DNAS runs in this container.
      Online__ExternalDnasServer: "${EXTERNAL_DNAS:-}"
    volumes:
      - socom2-data:/data          # accounts, stats, clans, DNAS tickets + packet logs, patch/APACHE00.ZDB
    ports:
      - "53:53/udp"
      - "80:80/tcp"            # patch download (APACHE00.ZDB)
      - "443:443/tcp"          # DNAS (DnaSDK) — unused when EXTERNAL_DNAS is set
      - "10069:10069/udp"
      - "10070:10070/tcp"
      - "10071:10071/tcp"
      - "10075:10075/tcp"
      - "10077:10077/tcp"

volumes:
  socom2-data:
